<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111211">
  <title>FORGE — affiche QR</title>
  <style>
    :root { color-scheme: dark; --ink:#111211; --orange:#ff6b35; --paper:#f7f5ef; --muted:#c4c1b7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; display:grid; place-items:center; background:#222320; color:var(--paper); font-family:system-ui,-apple-system,sans-serif; }
    .poster { width:min(100%,700px); min-height:920px; padding:56px 44px; background:var(--ink); border:2px solid #343530; border-radius:28px; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .brand { margin:0; font-size:27px; font-weight:950; letter-spacing:.13em; }
    .brand b { color:var(--orange); }
    h1 { max-width:560px; margin:48px 0 12px; font-size:clamp(34px,8vw,58px); line-height:1.02; letter-spacing:-.055em; }
    h1 span { color:var(--orange); }
    .tagline { margin:0 0 32px; color:var(--muted); font-size:18px; }
    .qr-frame { width:min(76vw,420px); padding:18px; border-radius:24px; background:#fff; }
    .qr-frame img { display:block; width:100%; height:auto; }
    .scan { margin:24px 0 30px; color:var(--orange); font-size:20px; font-weight:850; letter-spacing:.11em; }
    .choices { width:min(100%,480px); display:grid; gap:13px; text-align:left; }
    .choice { padding:16px 18px; border:1px solid #393a34; border-radius:15px; }
    .choice strong { display:block; margin-bottom:4px; color:var(--paper); font-size:16px; }
    .choice span { color:var(--muted); font-size:14px; }
    .url { margin:28px 0 0; color:#9b998f; font-size:13px; overflow-wrap:anywhere; }
    @media print {
      @page { size:A4 portrait; margin:0; }
      body { min-height:0; padding:0; background:#fff; color:var(--ink); }
      .poster { width:210mm; height:297mm; min-height:0; padding:15mm 14mm; border:0; border-radius:0; background:#fff; color:var(--ink); }
      .brand { font-size:18pt; }
      h1 { margin:13mm 0 3mm; font-size:34pt; }
      .tagline { margin-bottom:8mm; font-size:13pt; color:#555; }
      .qr-frame { width:94mm; padding:4mm; border:1px solid #ddd; border-radius:4mm; }
      .scan { margin:6mm 0 7mm; font-size:15pt; }
      .choices { width:160mm; gap:3mm; }
      .choice { padding:4mm 5mm; border-color:#ddd; border-radius:3mm; }
      .choice strong { color:var(--ink); font-size:12pt; }
      .choice span { color:#555; font-size:10pt; }
      .url { margin-top:6mm; color:#555; font-size:9pt; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <p class="brand"><b>▰</b> FORGE</p>
    <h1>TON ENTRAÎNEMENT.<br><span>À TON RYTHME.</span></h1>
    <p class="tagline">Scanne le QR code pour accéder à Forge.</p>
    <div class="qr-frame"><img src="forge-qr.png" alt="QR code pour ouvrir Forge"></div>
    <p class="scan">SCANNER POUR OUVRIR</p>
    <section class="choices" aria-label="Options selon le téléphone">
      <div class="choice"><strong>iPhone</strong><span>Ouvre directement la version web.</span></div>
      <div class="choice"><strong>Android</strong><span>Choisis d’installer l’APK ou d’utiliser la version web.</span></div>
    </section>
    <p class="url">forge-e1f5b.web.app</p>
  </main>
</body>
</html>
